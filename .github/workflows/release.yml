name: Build executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify tag matches CLI version
        if: github.ref_type == 'tag'
        env:
          QASMITH_TAG: ${{ github.ref_name }}
        run: test "$(go run ./cmd/qasmith version)" = "Qasmith $QASMITH_TAG"
      - name: Build executable
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          mkdir dist
          asset="qasmith-$TARGET_OS-$TARGET_ARCH"
          if [[ "$TARGET_OS" == windows ]]; then asset="$asset.exe"; fi
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -buildvcs=false -o "dist/$asset" ./cmd/qasmith
          (cd dist && sha256sum "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: qasmith-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: qasmith-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          QASMITH_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -c -- *.sha256)
          if gh release view "$QASMITH_TAG" >/dev/null 2>&1; then
            gh release upload "$QASMITH_TAG" dist/* scripts/install.sh scripts/install.ps1 --clobber
          else
            gh release create "$QASMITH_TAG" --verify-tag --generate-notes dist/* scripts/install.sh scripts/install.ps1
          fi
